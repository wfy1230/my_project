# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
  # dataset root dir
train: E:\dataset\InfraredUAV\train\images # train images (relative to 'path')  6471 images
val: E:\dataset\InfraredUAV\val\images # val images (relative to 'path')  548 images
#test:  # test images (optional)  1610 images

# Classes
names:
  0: car
  1: trunk
  2: person
  3: bus
  4: cyclist
  5: bike

